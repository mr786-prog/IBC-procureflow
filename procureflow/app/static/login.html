<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — IBC ProcureFlow</title>
  <link rel="stylesheet" href="/static/shared/css/tokens.css">
  <link rel="stylesheet" href="/static/shared/css/base.css">
  <link rel="stylesheet" href="/static/shared/css/components.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #27272a 0%, #121316 100%);
      padding: 20px;
    }

    /* ---- Login card ---- */
    .login-card {
      background: var(--color-surface);
      width: 100%;
      max-width: 420px;
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
      padding: 32px 28px;
      text-align: center;
    }

    /* ---- Logo ---- */
    .login-logo-container {
      margin-bottom: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-logo-img {
      height: 48px;       /* Fixed height — controls the logo size */
      max-height: 48px;
      max-width: 180px;   /* Prevents stretching on wide logos */
      width: auto;
      object-fit: contain;
    }

    /* ---- Headings ---- */
    .login-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 4px;
      color: var(--color-ibc-charcoal);
    }

    .login-subtitle {
      color: var(--color-text-muted);
      font-size: 0.8125rem;
      margin-bottom: 20px;
    }

    /* ---- Google OAuth button ---- */
    .btn-google {
      width: 100%;
      background: #ffffff;
      color: #1e293b;
      border: 1px solid #cbd5e1;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn-google:hover {
      background: #f8fafc;
      border-color: #94a3b8;
      text-decoration: none;
    }

    /* ---- OR divider ---- */
    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0 14px;
      color: #94a3b8;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }

    .divider span {
      padding: 0 10px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <!-- Logo -->
    <div class="login-logo-container">
      <img src="/static/shared/img/ibc-logo.jpeg"
           alt="IBC — Providing Fastening Solutions Since 1992"
           class="login-logo-img">
    </div>

    <h1 class="login-title">ProcureFlow Portal</h1>
    <p class="login-subtitle">Material Requisitions, Approvals &amp; Procurement</p>

    <!-- Google Sign-In (shown only when Google OAuth is configured) -->
    <div id="google-login-section" style="display:none;">
      <a href="/api/v1/auth/google/login" class="btn-google" id="btn-google-login">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Sign in with Google
      </a>
      <div class="divider"><span>or standard sign in</span></div>
    </div>

    <!-- Password login form -->
    <form id="login-form" style="text-align: left;">
      <div class="form-group">
        <label class="form-label" for="email">Work Email</label>
        <input type="email" id="email" class="form-input"
               placeholder="name@ibcbolts.com" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-input"
               placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px;">
        Sign In
      </button>
    </form><p class="footer-note">Access is strictly limited to authorised IBC personnel.</p>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { apiRequest, showToast } from "/static/shared/js/api.js";

    // ---- Reveal Google OAuth button if the backend has it configured ----
    async function checkOAuthStatus() {
      try {
        const cfg = await fetch("/api/v1/auth/config");
        if (cfg.ok) {
          const data = await cfg.json();
          if (data.google_oauth_enabled) {
            document.getElementById("google-login-section").style.display = "block";
          }
        }
      } catch (_) {
        // Backend not reachable — silently skip feature flags
      }
    }

    checkOAuthStatus();

    // ---- Password login ----
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const btn      = e.target.querySelector("button[type=submit]");

      btn.disabled    = true;
      btn.textContent = "Signing in…";

      try {
        const res = await apiRequest("/api/v1/auth/login", {
          method: "POST",
          body: JSON.stringify({ email, password })
        });
        window.location.href = res.redirect_url;
      } catch (_) {
        // Error toast already shown by apiRequest
      } finally {
        btn.disabled    = false;
        btn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
